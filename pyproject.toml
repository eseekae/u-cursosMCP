[project]
name = "ucursos-mcp"
version = "0.4.0"
description = "Servidor MCP de solo lectura para U-Cursos (Universidad de Chile)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=2.3,<3",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pydantic>=2.6",
    "pypdf>=5",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "browser-cookie3>=0.19",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ucursos-mcp = "ucursos_mcp.server:main"
ucursos-login = "ucursos_mcp.auth:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ucursos_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
