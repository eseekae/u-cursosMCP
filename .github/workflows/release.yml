# Arma la extensión de Claude Desktop (.mcpb) y la adjunta al release.
# Para publicar una versión: sube la versión en manifest.json y pyproject.toml,
# y crea un tag (ej. v0.2.0) o un release en GitHub.
# En cada pull request corre los tests y deja el .mcpb como artefacto (sin release).
# Versiones de prueba: con una versión beta en manifest.json (ej. 0.6.0-beta.1), correr este
# workflow a mano (Run workflow) sobre la rama crea el tag v0.6.0-beta.1 y una prerelease con
# el .mcpb, para probar desde Releases sin terminal. Un tag con guion también sale como prerelease.
name: Release extensión

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mcpb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Tests
        run: |
          uv venv
          uv pip install -e ".[dev]"
          uv run pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Empaquetar .mcpb
        run: |
          npx --yes @anthropic-ai/mcpb@2.1.2 validate manifest.json
          npx --yes @anthropic-ai/mcpb@2.1.2 pack . ucursos.mcpb

      - uses: actions/upload-artifact@v4
        with:
          name: ucursos-mcpb
          path: ucursos.mcpb

      - name: Adjuntar al release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ucursos.mcpb
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true

      - name: Versión del manifest
        id: version
        run: echo "v=$(jq -r .version manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Publicar versión de prueba
        if: github.event_name == 'workflow_dispatch' && contains(steps.version.outputs.v, '-')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.v }}
          name: v${{ steps.version.outputs.v }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: ucursos.mcpb
          generate_release_notes: true
