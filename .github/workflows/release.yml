# Arma la extensión de Claude Desktop (.mcpb) y el ejecutable único (Windows y Linux) y los adjunta al release.
# Para publicar una versión: sube la versión en manifest.json y pyproject.toml y mergea a main
# (el release v<versión> se crea solo). También funciona crear un tag v*.
# En cada pull request corre los tests y deja el .mcpb como artefacto (sin release),
# para instalarlo y probarlo con PRUEBAS.md antes de mergear.
name: Release extensión

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ejecutable:
    # Ejecutable único: doble clic lo instala en ChatGPT de escritorio, Claude Desktop y Cursor.
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, nombre: ucursos-mcp-windows.exe, origen: dist/ucursos-mcp.exe, extra: "--collect-all webview --collect-all pythonnet --collect-all clr_loader"}
          - {os: ubuntu-latest, nombre: ucursos-mcp-linux, origen: dist/ucursos-mcp, extra: ""}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Armar ejecutable
        shell: bash
        run: |
          uv venv
          uv pip install -e . pyinstaller
          uv run pyinstaller --onefile --name ucursos-mcp --paths src \
            --collect-submodules browser_cookie3 --collect-all mcp --collect-data tzdata \
            --copy-metadata ucursos-mcp ${{ matrix.extra }} ucursos_exe.py
          cp "${{ matrix.origen }}" "${{ matrix.nombre }}"

      - name: Probar que arranca
        shell: bash
        run: ./"${{ matrix.nombre }}" version

      - name: Probar que la ventana de inicio de sesión carga (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: ./"${{ matrix.nombre }}" ventana-login --comprobar

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.nombre }}
          path: ${{ matrix.nombre }}

  mcpb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Tests
        run: |
          uv venv
          uv pip install -e ".[dev]"
          uv run pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Empaquetar .mcpb
        run: |
          npx --yes @anthropic-ai/mcpb@2.1.2 validate manifest.json
          npx --yes @anthropic-ai/mcpb@2.1.2 pack . ucursos.mcpb

      - uses: actions/upload-artifact@v4
        with:
          name: ucursos-mcpb
          path: ucursos.mcpb

  publicar:
    # Publica el release una sola vez, con todos los archivos. Corre al mergear a main con una
    # versión que aún no tiene release (v<versión> de pyproject.toml) o al crear un tag v*.
    # Para publicar: sube la versión en manifest.json y pyproject.toml y mergea a main.
    needs: [ejecutable, mcpb]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Leer versión
        id: v
        run: |
          V=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          M=$(grep -m1 '"version"' manifest.json | cut -d'"' -f4)
          [ "$V" = "$M" ] || { echo "Versiones distintas: pyproject=$V manifest=$M"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: ¿Ya existe el release?
        id: existe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.v.outputs.version }}" >/dev/null 2>&1; then
            echo "existe=true" >> "$GITHUB_OUTPUT"
          else
            echo "existe=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.existe.outputs.existe == 'false' || startsWith(github.ref, 'refs/tags/')
        uses: actions/download-artifact@v4
        with:
          path: archivos
          merge-multiple: true

      - name: Publicar release
        if: steps.existe.outputs.existe == 'false' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.v.outputs.version) }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: archivos/*
