# Arma la extensión de Claude Desktop (.mcpb) y el ejecutable único (Windows, Mac, Linux) y los adjunta al release.
# Para publicar una versión: sube la versión en manifest.json y pyproject.toml,
# y crea un tag (ej. v0.2.0) o un release en GitHub.
# En cada pull request corre los tests y deja el .mcpb como artefacto (sin release),
# para instalarlo y probarlo con PRUEBAS.md antes de mergear.
name: Release extensión

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ejecutable:
    # Ejecutable único: doble clic lo instala en ChatGPT de escritorio, Claude Desktop y Cursor.
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, nombre: ucursos-mcp-windows.exe, origen: dist/ucursos-mcp.exe}
          - {os: macos-latest, nombre: ucursos-mcp-mac, origen: dist/ucursos-mcp}
          - {os: ubuntu-latest, nombre: ucursos-mcp-linux, origen: dist/ucursos-mcp}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Armar ejecutable
        shell: bash
        run: |
          uv venv
          uv pip install -e . pyinstaller
          uv run pyinstaller --onefile --name ucursos-mcp --paths src \
            --collect-submodules browser_cookie3 --collect-all mcp --collect-data tzdata \
            --copy-metadata ucursos-mcp ucursos_exe.py
          cp "${{ matrix.origen }}" "${{ matrix.nombre }}"

      - name: Probar que arranca
        shell: bash
        run: ./"${{ matrix.nombre }}" version

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.nombre }}
          path: ${{ matrix.nombre }}

      - name: Adjuntar al release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.nombre }}

  mcpb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Tests
        run: |
          uv venv
          uv pip install -e ".[dev]"
          uv run pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Empaquetar .mcpb
        run: |
          npx --yes @anthropic-ai/mcpb@2.1.2 validate manifest.json
          npx --yes @anthropic-ai/mcpb@2.1.2 pack . ucursos.mcpb

      - uses: actions/upload-artifact@v4
        with:
          name: ucursos-mcpb
          path: ucursos.mcpb

      - name: Adjuntar al release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ucursos.mcpb
